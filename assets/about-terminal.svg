<svg xmlns="http://www.w3.org/2000/svg" width="880" height="406" viewBox="0 0 880 406" role="img" aria-label="Terminal: cat about.txt. I am a cybersecurity student based in Amman, Jordan, studying for a Bachelor's in Cybersecurity at Applied Science University, graduating 2029, and playing CTFs with Jordan Cyber Club: web exploitation, reverse engineering and hardware security. Alongside that I am doing 42 Amman, writing C and systems projects like Minishell and Philosophers. Outside of code: guitar and chess.">
<style>
text{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:700;white-space:pre}
.l{opacity:0;animation:s .01s steps(1) var(--t) forwards}@keyframes s{to{opacity:1}}
.ty{clip-path:inset(-6px 100% -6px 0);animation:ty var(--d) steps(var(--n),end) var(--t) forwards}
