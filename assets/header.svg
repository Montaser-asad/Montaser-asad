<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Montaser Asad. Software Engineer. Systems, networking, low-level C. Amman, Jordan. 42 Amman (ASU).">
  <style>
    :root { --bg:#f6f4ee; --ink:#1b1b1f; --mute:#6b6a66; --line:#d8d4c8; --acc:#d9480f; --fill:#ece8db; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --ink:#e8e6e1; --mute:#8d8b86; --line:#2b2e34; --acc:#ff8a4c; --fill:#1c1f25; } }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular','DejaVu Sans Mono',Consolas,monospace; }
    .sans { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; }
    .name { font-size:56px; font-weight:700; fill:var(--ink); letter-spacing:-1.5px; }
    .sub  { font-size:17px; fill:var(--ink); }
    .meta { font-size:13px; fill:var(--mute); }
    .tag  { font-size:11px; fill:var(--acc); letter-spacing:2px; }
    .seg  { fill:var(--fill); stroke:var(--ink); stroke-width:1.5; }
    .segt { font-size:12px; fill:var(--ink); }
    .small{ font-size:10px; fill:var(--mute); }
    .acc  { fill:var(--acc); }
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--line)" stroke-width="0.6"/></pattern>
  </defs>
  <rect width="900" height="280" fill="var(--bg)"/>
  <rect width="900" height="280" fill="url(#g)"/>
  <rect x="10" y="10" width="880" height="260" fill="none" stroke="var(--ink)" stroke-width="1.5"/>

  <text x="40" y="52" class="mono tag">PROFILE / MONTASER-ASAD</text>
  <text x="38" y="124" class="sans name">Montaser Asad</text>
  <rect x="40" y="144" width="56" height="4" class="acc"/>
  <text x="40" y="184" class="mono sub">Software Engineer</text>
  <text x="40" y="210" class="mono meta">Systems  ·  Networking  ·  Low-level C</text>
  <text x="40" y="240" class="mono meta">Amman, Jordan  /  42 Amman (ASU)</text>

  <g class="mono">
    <text x="600" y="30" class="small" text-anchor="end">high</text>
    <rect x="620" y="26" width="240" height="40" class="seg"/>
    <text x="640" y="51" class="segt">stack</text><text x="840" y="51" class="segt acc" text-anchor="end">↓</text>

    <rect x="620" y="66" width="240" height="26" fill="none" stroke="var(--mute)" stroke-dasharray="4 3"/>

    <rect x="620" y="92" width="240" height="40" class="seg"/>
    <text x="640" y="117" class="segt">heap</text><text x="840" y="117" class="segt acc" text-anchor="end">↑</text>

    <rect x="620" y="132" width="240" height="36" class="seg"/>
    <text x="640" y="155" class="segt">.bss</text>

    <rect x="620" y="168" width="240" height="36" class="seg"/>
    <text x="640" y="191" class="segt">.data</text>

    <rect x="620" y="204" width="240" height="36" class="seg"/>
    <text x="640" y="227" class="segt">.text</text>
    <text x="600" y="238" class="small" text-anchor="end">low</text>
  </g>
</svg>
