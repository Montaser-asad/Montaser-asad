<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Focus areas: Systems (processes, pipes, signals, threads), Networking (IPv4, subnets, routing), Embedded (Arduino)">
  <style>
    :root { --bg:#f6f4ee; --ink:#1b1b1f; --mute:#6b6a66; --line:#d8d4c8; --acc:#d9480f; --fill:#ece8db; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --ink:#e8e6e1; --mute:#8d8b86; --line:#2b2e34; --acc:#ff8a4c; --fill:#1c1f25; } }
    text { font-family:'JetBrains Mono','SFMono-Regular','DejaVu Sans Mono',Consolas,monospace; }
    .card { fill:var(--bg); stroke:var(--ink); stroke-width:1.5; }
    .box  { fill:var(--fill); stroke:var(--ink); stroke-width:1.5; }
    .ln   { stroke:var(--ink); stroke-width:1.5; fill:none; }
    .ac   { fill:var(--acc); stroke:var(--ink); stroke-width:1.5; }
    .ttl  { font-size:15px; font-weight:700; fill:var(--ink); }
    .kw   { font-size:11px; fill:var(--mute); }
    .lbl  { font-size:10px; fill:var(--ink); }
  </style>

  <!-- Systems -->
  <rect x="10" y="10" width="280" height="170" class="card"/>
  <rect x="30" y="34" width="62" height="34" class="box"/><text x="61" y="55" class="lbl" text-anchor="middle">cmd</text>
  <rect x="124" y="34" width="62" height="34" class="box"/><text x="155" y="55" class="lbl" text-anchor="middle">cmd</text>
  <rect x="218" y="34" width="52" height="34" class="ac"/><text x="244" y="55" class="lbl" text-anchor="middle" style="fill:var(--bg)">out</text>
  <path d="M92 51H124M186 51H218" class="ln"/><path d="M118 46l6 5-6 5M212 46l6 5-6 5" class="ln"/>
  <text x="108" y="82" class="kw" text-anchor="middle">|</text>
  <text x="30" y="124" class="ttl">Systems</text>
  <text x="30" y="146" class="kw">fork · pipes · signals</text>
  <text x="30" y="162" class="kw">pthreads · mutexes</text>

  <!-- Networking -->
  <rect x="310" y="10" width="280" height="170" class="card"/>
  <path d="M385 52L450 38M450 38L515 52M385 52L450 80M515 52L450 80" class="ln"/>
  <circle cx="385" cy="52" r="9" class="box"/><circle cx="515" cy="52" r="9" class="box"/>
  <circle cx="450" cy="38" r="9" class="ac"/><circle cx="450" cy="80" r="9" class="box"/>
  <text x="330" y="124" class="ttl">Networking</text>
  <text x="330" y="146" class="kw">IPv4 · subnets</text>
  <text x="330" y="162" class="kw">routing · gateways</text>

  <!-- Embedded -->
  <rect x="610" y="10" width="280" height="170" class="card"/>
  <rect x="705" y="34" width="90" height="48" class="box"/><rect x="740" y="50" width="20" height="16" class="ac"/>
  <path d="M715 34v-10M735 34v-10M755 34v-10M775 34v-10M715 82v10M735 82v10M755 82v10M775 82v10M705 46h-10M705 70h-10M795 46h10M795 70h10" class="ln"/>
  <text x="630" y="124" class="ttl">Embedded</text>
  <text x="630" y="146" class="kw">Arduino · C++</text>
  <text x="630" y="162" class="kw">hardware tinkering</text>
</svg>
