<svg xmlns="http://www.w3.org/2000/svg" width="880" height="328" viewBox="0 0 880 328" role="img" aria-label="About: a cybersecurity student based in Amman, Jordan, working on a Bachelor's in Cybersecurity at Applied Science University, drawn to security by how much they like finding out how things break. Doing 42 Amman with C and systems projects, running a self-built Debian home server and working on its security and infrastructure. Next goal: go deeper into where systems and security meet. Outside of code: a diploma in Fine Arts (guitar) and chess.">
<style>text{font-family:-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:500;white-space:pre}.t{font-size:21px;font-weight:700}</style>
<rect x="1" y="1" width="878" height="326" rx="12" fill="#0f111a" stroke="#2a2d3e" stroke-width="2"/>
<rect x="1" y="1" width="6" height="326" rx="3" fill="#ff6ac1"/>
<text x="34" y="46" class="t" fill="#ff6ac1">About me</text>
<rect x="34" y="56" width="48" height="3" rx="1.5" fill="#ff6ac1"/>
<text x="34" y="84"><tspan fill="#ffffff">I'm a </tspan><tspan fill="#57d7ff">cybersecurity</tspan><tspan fill="#ffffff"> student based in Amman, Jordan, working on a Bachelor's in</tspan></text>
<text x="34" y="110"><tspan fill="#57d7ff">Cybersecurity</tspan><tspan fill="#ffffff"> at Applied Science University. What pulled me into security is how</tspan></text>
<text x="34" y="136"><tspan fill="#ffffff">much I like finding out </tspan><tspan fill="#57d7ff">how things break</tspan><tspan fill="#ffffff">.</tspan></text>
<text x="34" y="176"><tspan fill="#ffffff">Alongside that I'm doing </tspan><tspan fill="#fff06b">42 Amman</tspan><tspan fill="#ffffff">, where I write </tspan><tspan fill="#5af78e">C</tspan><tspan fill="#ffffff"> and systems projects. I also</tspan></text>
<text x="34" y="202"><tspan fill="#ffffff">run a self-built </tspan><tspan fill="#fff06b">Debian</tspan><tspan fill="#ffffff"> home server and work on its security and infrastructure.</tspan></text>
<text x="34" y="242"><tspan fill="#ffffff">Next, I want to go deeper into where </tspan><tspan fill="#57d7ff">systems</tspan><tspan fill="#ffffff"> and </tspan><tspan fill="#57d7ff">security</tspan><tspan fill="#ffffff"> meet.</tspan></text>
<text x="34" y="282"><tspan fill="#ffffff">Outside of code: I have a diploma in </tspan><tspan fill="#fff06b">Fine Arts</tspan><tspan fill="#ffffff"> (guitar) and I play chess.</tspan></text>
</svg>