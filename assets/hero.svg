<text x="30" y="334" textLength="617.88" lengthAdjust="spacing" fill="#ffffff" class="ty" style="--n:57;--d:1.03s;--t:7.66s"><tspan fill="#ffffff">I'm studying for a Bachelor's in </tspan><tspan fill="#57d7ff">Cybersecurity</tspan><tspan fill="#ffffff"> at Applied</tspan></text>
