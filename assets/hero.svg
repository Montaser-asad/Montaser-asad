<text x="30" y="438" textLength="596.20" lengthAdjust="spacing" fill="#ffffff" class="ty" style="--n:55;--d:0.99s;--t:10.83s"><tspan fill="#ffffff">Outside of code: I have a diploma in </tspan><tspan fill="#fff06b">Fine Arts</tspan><tspan fill="#ffffff"> (guitar)</tspan></text>
<text x="30" y="464" textLength="184.28" lengthAdjust="spacing" fill="#ffffff" class="ty" style="--n:17;--d:0.31s;--t:11.87s"><tspan fill="#ffffff">and I play chess.</tspan></text>
