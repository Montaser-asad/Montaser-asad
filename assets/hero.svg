<text x="30" y="386" textLength="585.36" lengthAdjust="spacing" fill="#ffffff" class="ty" style="--n:54;--d:0.97s;--t:9.45s"><tspan fill="#ffffff">Alongside that I'm doing </tspan><tspan fill="#fff06b">42 Amman</tspan><tspan fill="#ffffff">, where I write </tspan><tspan fill="#5af78e">C</tspan><tspan fill="#ffffff"> and</tspan></text>
