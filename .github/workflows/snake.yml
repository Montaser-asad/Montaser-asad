name: Contribution snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Keep the snake inside the tile grid
        run: |
          python3 - <<'PY'
          import glob, re
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              m = re.search(r'viewBox="-16 -32 (\d+) (\d+)"', s)
              if not m:
                  continue
              w, h = int(m[1]) - 32, int(m[2]) - 80
              s = re.sub(r'viewBox="-16 -32 \d+ \d+" width="\d+" height="\d+"',
                         f'viewBox="0 0 {w} {h}" width="{w}" height="{h}"', s, count=1)
              clamp = lambda v, lo, hi: max(lo, min(hi, v))
              s = re.sub(r'translate\((-?[\d.]+)px,(-?[\d.]+)px\)',
                         lambda m: f"translate({clamp(float(m[1]), 0, w - 16):g}px,{clamp(float(m[2]), 0, h - 16):g}px)", s)
              open(f, "w").write(s)
          PY
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          author: Montaser-asad <montserasad@gmail.com>
          committer: Montaser-asad <montserasad@gmail.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
