name: Update profile graphics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/gen_terminal.py", ".github/scripts/gen_cards.py", ".github/workflows/update-terminal.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gen_terminal.py assets/intro.svg
          python3 .github/scripts/gen_cards.py
      - name: Commit if changed
        run: |
          git config user.name "Montaser-asad"
          git config user.email "montserasad@gmail.com"
          git add assets/intro.svg assets/project-*.svg assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "Update profile graphics" && git push)
