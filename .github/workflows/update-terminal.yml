name: Update terminal

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/gen_terminal.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate terminal.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_terminal.py assets/terminal-live.svg
      - name: Commit if changed
        run: |
          git config user.name "Montaser-asad"
          git config user.email "montserasad@gmail.com"
          git add assets/terminal-live.svg
          git diff --cached --quiet || (git commit -m "Update terminal data" && git push)
